name: build-and-test
on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - master
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - master

jobs:
  build-ant-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipx
          pipx install poetry==2.2.1
          make install
      - name: Type-check Cloudflare Worker
        working-directory: container/cloudflare/worker
        run: npm ci && npm run type-check
      - name: Build Docker images
        run: |
          make docker-build-all
          docker build -f container/cloudflare/Dockerfile -t latex-on-http-cloudflare:test .
      - name: Run tests (using locally built Docker images)
        run: make test-docker-compose
